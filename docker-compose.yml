services:
  db:
    image: postgres:16-alpine
    container_name: forecastia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forecastia
      POSTGRES_PASSWORD: forecastia
      POSTGRES_DB: forecastia
    ports:
      - '5432:5432'
    volumes:
      - forecastia-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forecastia']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: forecastia-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://forecastia:forecastia@db:5432/forecastia?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - '4000:4000'
    command: sh -c "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npx tsx apps/api/prisma/seed.ts && node apps/api/dist/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: forecastia-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  forecastia-db-data:
